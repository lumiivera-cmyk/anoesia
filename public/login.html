<!doctype html>
<!--
  The login page (src/login.ts), shown only when Anoesia is on a server
  with a password set (docs/hosting.md). Everything it needs is in this
  file, because nothing else is served until you've logged in.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Anoesia</title>
    <meta name="theme-color" content="#08080C" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Anoesia" />
    <style>
      :root {
        color-scheme: dark;
        /* the lacquer theme's colours (anoesia.css), copied because nothing else is served before logging in */
        --bg: #08080C;
        --panel: #15131C;
        --text: #F2EEF9;
        --muted: #CBC5D9;
        --accent: #4DB8FF;
        --on-accent: #062A44;
        --error: #FF8FA3;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; margin: 0; }
      body {
        background: radial-gradient(ellipse 30% 40% at 12% 70%, rgba(168, 108, 255, 0.12), transparent 70%),
          radial-gradient(ellipse 28% 45% at 90% 30%, rgba(255, 79, 216, 0.11), transparent 70%),
          radial-gradient(ellipse 40% 22% at 45% 4%, rgba(77, 184, 255, 0.1), transparent 70%), var(--bg);
        color: var(--text);
        font: 16px/1.4 "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
        display: grid;
        place-items: center;
        padding: 16px;
        padding-top: max(16px, env(safe-area-inset-top));
      }
      form {
        width: 100%;
        max-width: 340px;
        background: var(--panel);
        border-radius: 22px;
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08), 0 18px 48px rgba(0, 0, 0, 0.55);
        padding: 28px 24px;
        display: grid;
        gap: 14px;
        text-align: center;
      }
      img { width: 64px; height: 64px; margin: 0 auto; border-radius: 16px; }
      h1 { font-size: 22px; margin: 0; }
      p { margin: 0; color: var(--muted); font-size: 14px; }
      input {
        width: 100%;
        font: inherit;
        /* 16px or more, so iPhone doesn't zoom in on focus. */
        font-size: 16px;
        padding: 12px;
        border-radius: 12px;
        border: 0;
        background: #0B0A10;
        box-shadow: inset 0 2px 4px rgba(0, 0, 0, 0.6);
        color: var(--text);
      }
      button {
        font: inherit;
        font-weight: 700;
        padding: 12px;
        min-height: 44px;
        border: 0;
        border-radius: 12px;
        background: var(--accent);
        color: var(--on-accent);
        box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 0 12px rgba(77, 184, 255, 0.45);
        cursor: pointer;
      }
      button:disabled { opacity: 0.6; }
      .error { color: var(--error); min-height: 1.4em; }
      .hidden-name { position: absolute; left: -9999px; width: 1px; height: 1px; }
    </style>
  </head>
  <body>
    <form id="login" method="post" action="api/login">
      <img src="icon.svg" alt="" />
      <h1>Anoesia</h1>
      <p>Enter your password to come in.</p>
      <!-- A name for password managers (iCloud Keychain) to save the password under. -->
      <input class="hidden-name" type="text" name="username" value="anoesia" autocomplete="username" tabindex="-1" aria-hidden="true" />
      <input id="password" type="password" name="password" autocomplete="current-password" placeholder="Password" required autofocus aria-label="Password" />
      <button type="submit">Log in</button>
      <p class="error" id="error" role="alert"></p>
    </form>
    <script>
      const form = document.getElementById("login");
      const error = document.getElementById("error");
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const button = form.querySelector("button");
        button.disabled = true;
        error.textContent = "";
        try {
          const response = await fetch("api/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: form.elements.password.value }),
          });
          if (response.ok) {
            location.replace("./");
            return;
          }
          const data = await response.json().catch(() => ({}));
          error.textContent = data.error || "Couldn't log in. Try again.";
          form.elements.password.select();
        } catch {
          error.textContent = "Can't reach the server. Check your connection and try again.";
        } finally {
          button.disabled = false;
        }
      });
    </script>
  </body>
</html>
