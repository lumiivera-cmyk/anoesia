<!doctype html>
<!--
  Anoesia's single page, in the lacquer material (anoesia.css is the design
  system; app.css lays out these pages).

    .bg              the photo behind everything, and its dimmer
    .side            chats and the app's pages (wide screens; a drawer on a phone)
    main
      #view-chat     the open chat: header, messages, composer
      #view-prompts  this chat's prompt: blocks in send order, and the preview
      #view-cards    the card library and the card editor
      #view-settings connections and profiles, look, agent, typing
    dialogs          drawer, menus, sheets, chat settings, import, editors

  Pages are hash routes (#/chat/<id>, #/prompts, #/cards/<id>,
  #/settings/<section>, #/settings/profile/<id>); js/main.js
  starts it all.
-->
<html lang="en" class="theme-lacquer">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <title>Anoesia</title>
    <meta name="theme-color" content="#08080C" />
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&amp;display=swap" />
    <link rel="stylesheet" href="anoesia.css" />
    <link rel="stylesheet" href="app.css" />
    <script type="module" src="js/main.js"></script>
  </head>
  <body class="ground">
    <div class="bg" aria-hidden="true"><img id="bg-img" alt="" /><div class="bg-dim"></div></div>

    <div class="app">
      <aside class="side glass" aria-label="Chats and app" id="side"></aside>

      <main id="main">
        <!-- The chat -->
        <section class="view view-chat" id="view-chat" aria-labelledby="chat-name">
          <header class="chat-head">
            <button type="button" class="ghost press ib phone-only" id="open-drawer" aria-label="Chats"></button>
            <div class="chat-title">
              <h1 class="disp" id="chat-name">Anoesia</h1>
              <span class="meta" id="chat-meta"></span>
            </div>
            <button type="button" class="btnreset hit44 phone-title phone-only" id="phone-title" aria-label="Chat settings"></button>
            <ul class="cast-chips wide-only" id="cast-chips" aria-label="Cast"></ul>
            <div class="head-buttons">
              <a class="raised press ib" id="go-preview" href="#/prompts/preview" aria-label="Preview what gets sent" title="Preview what gets sent"></a>
              <a class="raised press ib" id="go-prompts" href="#/prompts" aria-label="Prompts page" title="Prompts page"></a>
              <button type="button" class="raised press ib" id="open-chat-settings" aria-label="Chat settings" title="Chat settings"></button>
              <button type="button" class="btn raised press wide-only" id="open-agent" title="Open the agent">Agent</button>
              <button type="button" class="raised press ib phone-only" id="open-agent-phone" aria-label="Open the agent" title="Agent">A</button>
            </div>
          </header>

          <div class="msgs-scroll scroll" id="messages-scroll" tabindex="0" aria-label="Messages">
            <div class="msgs-col" id="messages" aria-live="polite"></div>
          </div>

          <div class="composer-wrap">
            <div class="reply-error raised" id="reply-error" role="alert" hidden>
              <span class="err-text" data-text></span>
              <button type="button" class="btn ghost press" id="retry">try again</button>
              <button type="button" class="ghost press ib" id="dismiss-error" aria-label="Dismiss"></button>
            </div>
            <form class="composer sunk" id="composer">
              <label class="sr" for="composer-input" id="composer-label">Write your turn</label>
              <textarea id="composer-input" rows="2" placeholder="Write your turn…"></textarea>
              <div class="composer-row">
                <button type="button" class="ghost press btn scene-btn" id="open-scene" aria-haspopup="dialog" title="Who's onstage, and this chat's notes">scene</button>
                <span class="meta hint wide-only" id="enter-hint">enter sends · shift+enter for a new line</span>
                <button type="button" class="ghost press btn continue" id="continue" title="Send without new text and let the narrator go on">continue</button>
                <button type="submit" class="press ib send" id="send" aria-label="Send"></button>
                <button type="button" class="raised press ib" id="stop" aria-label="Stop writing" hidden></button>
              </div>
            </form>
          </div>
        </section>

        <!-- The prompts page -->
        <section class="view view-page view-prompts" id="view-prompts" aria-labelledby="prompts-title" hidden>
          <header class="page-head">
            <a class="ghost press ib" id="prompts-back" href="#/" aria-label="Back to the chat"></a>
            <div class="page-title">
              <h1 class="disp" id="prompts-title">Prompts</h1>
              <span class="meta" id="prompts-meta"></span>
            </div>
            <div class="meter" role="meter" aria-label="Prompt size" id="prompt-meter" aria-valuemin="0">
              <div class="meter-top"><span class="meter-n" id="meter-n"></span><span class="meta" id="meter-of"></span></div>
              <div class="sunk meter-bar"><div class="meter-fill" id="meter-fill"></div></div>
            </div>
          </header>
          <div class="seg sunk view-tabs" role="tablist" aria-label="Prompts views" id="prompts-tabs">
            <button type="button" role="tab" id="tab-blocks" aria-controls="blocks-pane" aria-selected="true">Blocks</button>
            <button type="button" role="tab" id="tab-preview" aria-controls="preview-pane" aria-selected="false">Preview</button>
          </div>
          <div class="prompts-cols">
            <section class="blocks-pane scroll" id="blocks-pane" role="tabpanel" aria-labelledby="tab-blocks" aria-label="Prompt blocks, in send order" tabindex="0">
              <ol class="block-list" id="block-list"></ol>
              <div class="add-row">
                <button type="button" class="raised press btn" id="add-block"></button>
                <button type="button" class="raised press btn" data-nudge="pace" title="A note after your post: keep the reply about as long as yours">match my pace</button>
                <button type="button" class="raised press btn" data-nudge="restraint" title="A note after your post: stop where you can respond">scene restraint</button>
              </div>
              <p class="sr" id="drag-status" role="status" aria-live="assertive"></p>
            </section>
            <section class="preview-pane glass deep" id="preview-pane" role="tabpanel" aria-labelledby="tab-preview" aria-label="Preview of what gets sent">
              <div class="preview-head">
                <div class="preview-title"><span class="eyebrow">Preview</span><span class="meta">exactly what gets sent right now</span></div>
                <div class="seg sunk" role="tablist" aria-label="Preview view">
                  <button type="button" role="tab" id="pv-blocks" aria-selected="true" aria-controls="preview-body">By block</button>
                  <button type="button" role="tab" id="pv-sent" aria-selected="false" aria-controls="preview-body">As sent</button>
                </div>
              </div>
              <div class="preview-body scroll" id="preview-body" role="tabpanel" tabindex="0" aria-label="Preview content"></div>
            </section>
          </div>
        </section>

        <!-- Cards -->
        <section class="view view-page view-cards" id="view-cards" aria-labelledby="cards-title" hidden>
          <header class="page-head">
            <a class="ghost press ib phone-only" id="cards-back" href="#/cards" aria-label="All cards"></a>
            <div class="page-title">
              <h1 class="disp" id="cards-title">Cards</h1>
              <span class="meta" id="cards-meta"></span>
            </div>
            <div class="head-buttons">
              <button type="button" class="btn raised press" id="open-import"></button>
              <button type="button" class="btn raised press new-card" id="new-card"></button>
            </div>
          </header>
          <div class="cards-cols">
            <section class="col library scroll" id="library" aria-label="All cards" tabindex="0">
              <div class="find">
                <label class="sr" for="find">Find a card</label>
                <span class="find-icon" id="find-icon"></span>
                <input id="find" class="sunk inp" placeholder="find a card" autocomplete="off" />
              </div>
              <div id="card-groups"></div>
            </section>
            <section class="col editor scroll" id="card-editor" aria-label="Card editor" tabindex="0"></section>
            <section class="col rail scroll" id="card-rail" aria-label="Where this card is used" tabindex="0"></section>
          </div>
        </section>

        <!-- Settings -->
        <section class="view view-page view-settings" id="view-settings" aria-labelledby="settings-title" hidden>
          <header class="page-head">
            <a class="ghost press ib phone-only" id="settings-back" href="#/" aria-label="Back"></a>
            <div class="page-title">
              <h1 class="disp" id="settings-title">Settings</h1>
              <span class="meta wide-only">changes save as you make them</span>
            </div>
          </header>
          <div class="set-cols">
            <nav class="set-nav scroll" id="settings-nav" aria-label="Settings sections" tabindex="0"></nav>
            <section class="set-main scroll" id="settings-main" tabindex="0"><div class="set-in" id="settings-body"></div></section>
          </div>
        </section>
      </main>
    </div>


    <aside class="agent-panel glass" id="agent-panel" hidden aria-label="Agent">
      <header class="agent-header">
        <select id="agent-session" aria-label="Session"></select>
        <button type="button" class="btn raised press" id="agent-new">New</button>
        <button type="button" class="ghost press ib" id="agent-close" aria-label="Close the agent">✕</button>
      </header>
      <div class="seg sunk agent-modes" role="tablist" aria-label="Which agent">
        <button type="button" class="agent-mode active" data-agent-mode="main" role="tab" aria-selected="true">Main agent</button>
        <button type="button" class="agent-mode" data-agent-mode="chat" role="tab" aria-selected="false">A chat's agent</button>
      </div>
      <div class="seg sunk agent-tabs" role="tablist" aria-label="Agent views">
        <button type="button" class="tab active" data-agent-tab="chat" role="tab" aria-selected="true">Chat</button>
        <button type="button" class="tab" data-agent-tab="changes" role="tab" aria-selected="false">Changes</button>
        <button type="button" class="tab" data-agent-tab="files" role="tab" aria-selected="false">Files</button>
      </div>
      <section class="agent-chat" id="agent-chat">
        <div class="agent-log scroll" id="agent-log" aria-live="polite"></div>
        <div class="agent-error" id="agent-error" role="alert" hidden></div>
        <form class="agent-composer" id="agent-form">
          <textarea id="agent-input" rows="3" placeholder="Ask the agent…" aria-label="Message to the agent"></textarea>
          <div class="row end"><button type="button" class="btn raised press" id="agent-stop" hidden>Stop</button><button type="submit" class="btn btn-primary press" id="agent-send">Send</button></div>
        </form>
      </section>
      <section class="agent-scroll scroll" id="agent-changes" hidden></section>
      <section class="agent-scroll scroll" id="agent-files" hidden></section>
    </aside>

    <!-- Overlays. Each is a <dialog>: see js/overlay.js. -->
    <dialog class="ov drawer glass" id="drawer" aria-label="Chats and app"></dialog>

    <!-- The scene: who's onstage, and the chat's notes (js/scene.js). -->
    <dialog class="ov menu raised pop sheet-on-phone scene-menu" id="scene-menu" aria-labelledby="scene-title" data-side="above"></dialog>

    <dialog class="ov menu raised pop msg-menu" id="message-menu" aria-label="Message actions">
      <div class="lifted raised" id="lifted" aria-hidden="true"></div>
      <div role="menu" aria-label="Message actions" id="message-menu-items"></div>
    </dialog>

    <dialog class="ov menu raised pop" id="role-menu" aria-label="Role">
      <div role="menu" aria-label="Role" id="role-menu-items"></div>
    </dialog>

    <dialog class="ov menu raised pop sheet-on-phone" id="move-menu" aria-label="Move">
      <div class="menu-head" id="move-head"></div>
      <div role="menu" aria-labelledby="move-head" id="move-menu-items"></div>
    </dialog>

    <dialog class="ov cpop raised pop sheet-on-phone" id="colour-picker" aria-labelledby="cp-title"></dialog>

    <dialog class="ov full raised" id="text-editor" aria-labelledby="te-title">
      <form class="te" id="te-form">
        <header class="te-head">
          <button type="button" class="btn ghost press" data-te-cancel>Cancel</button>
          <div class="te-title"><h2 id="te-title" class="disp"></h2><span class="meta" id="te-sub"></span></div>
          <button type="submit" class="btn btn-primary press">Save</button>
        </header>
        <div class="te-name" id="te-name-row" hidden>
          <label class="sr" for="te-name">Title</label>
          <input id="te-name" class="sunk inp" autocomplete="off" />
        </div>
        <label class="sr" for="te-text" id="te-text-label">Text</label>
        <textarea id="te-text" class="sunk te-text"></textarea>
        <div class="te-foot">
          <div class="macbar sunk" id="te-macbar" role="group" aria-label="Insert a macro"></div>
          <div class="te-meta"><span class="meta" id="te-note"></span><span class="tok sunk" id="te-tok"></span></div>
        </div>
      </form>
    </dialog>

    <dialog class="ov dlg raised" id="confirm-dialog" role="alertdialog" aria-labelledby="confirm-title" aria-describedby="confirm-body">
      <h2 id="confirm-title" class="disp"></h2>
      <div id="confirm-body" class="dlg-text"></div>
      <div class="dlg-buttons">
        <button type="button" class="btn raised press" data-keep>keep it</button>
        <button type="button" class="btn raised press" data-alt hidden></button>
        <button type="button" class="btn btn-danger press" data-confirm><span class="bi" id="confirm-icon"></span><span></span></button>
      </div>
    </dialog>

    <dialog class="ov dlg raised wide-dlg" id="chat-dialog" aria-labelledby="chat-dialog-title"></dialog>
    <!-- Settings: the profile and region lists, and the model list (a combobox over a listbox). -->
    <dialog class="ov menu raised pop sheet-on-phone pick-menu" id="pick-menu" aria-label="Choose"></dialog>
    <dialog class="ov raised pop sheet-on-phone mpick" id="model-picker" aria-label="Choose a model"></dialog>
    <dialog class="ov dlg raised wide-dlg" id="import-dialog" aria-labelledby="import-title"></dialog>

    <div class="toast raised" id="toast" role="alert" hidden>
      <span data-text></span>
      <button type="button" class="ghost press ib" id="toast-close" aria-label="Dismiss"></button>
    </div>
  </body>
</html>
