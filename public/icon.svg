<!--
  Anoesia's app icon: the wordmark's three beads (violet, blue, pink) on
  black lacquer. Not a designed icon yet, only the brand beads; the artwork
  stays inside the central 80% so a launcher can crop it to a circle.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="lac" cx="50%" cy="0%" r="110%">
      <stop offset="0" stop-color="#232031"/>
      <stop offset="1" stop-color="#0B0A10"/>
    </radialGradient>
    <radialGradient id="v" cx="50%" cy="85%" r="60%"><stop offset="0" stop-color="#EEDCFF"/><stop offset=".45" stop-color="#B488FF"/><stop offset=".9" stop-color="#5B22B8"/></radialGradient>
    <radialGradient id="b" cx="50%" cy="85%" r="60%"><stop offset="0" stop-color="#E3F5FF"/><stop offset=".45" stop-color="#62C3FF"/><stop offset=".9" stop-color="#0F5FA0"/></radialGradient>
    <radialGradient id="p" cx="50%" cy="85%" r="60%"><stop offset="0" stop-color="#FFE3F6"/><stop offset=".45" stop-color="#FF6FD8"/><stop offset=".9" stop-color="#A3187F"/></radialGradient>
  </defs>
  <rect width="512" height="512" fill="url(#lac)"/>
  <g stroke="rgba(255,255,255,.35)" stroke-width="3">
    <circle cx="150" cy="256" r="52" fill="url(#v)"/>
    <circle cx="256" cy="256" r="52" fill="url(#b)"/>
    <circle cx="362" cy="256" r="52" fill="url(#p)"/>
  </g>
  <g fill="#fff" opacity=".55">
    <ellipse cx="136" cy="230" rx="16" ry="9"/>
    <ellipse cx="242" cy="230" rx="16" ry="9"/>
    <ellipse cx="348" cy="230" rx="16" ry="9"/>
  </g>
</svg>
